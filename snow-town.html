<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雪原の町づくり</title>
<style>
  html,body{margin:0;height:100%;background:#e9f2f9;color:#0e2846;color-scheme:light;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none;position:fixed;left:0;top:0}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov">
  <h1 id="ovT">雪原の町づくり</h1>
  <p id="ovP">木やクマに近づくと自動で伐採・攻撃！<br>肉や毛皮はお店に運ぶと売れてお金になる。<br>丸太・石・毛皮・お金で町を発展させ、<br>新しいエリアを開拓して<b>大かまど</b>を完成させよう。</p>
  <button id="ovB">はじめる</button>
  <button id="ovR" class="sub" hidden>最初からやり直す</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB'),ovR=document.getElementById('ovR');
const FONT='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
let W,H,DPR,Z;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  Z=Math.max(.7,Math.min(1.25,Math.min(W,H)/500));
}
addEventListener('resize',resize);resize();
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};

/* ================= world layout ================= */
const WW=2400,WH=2440;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const R=(a,b)=>a+Math.random()*(b-a);
let seed=11;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const ZONE={
  A:{x0:80,x1:2320,y0:690,y1:1110,name:'森'},
  B:{x0:70,x1:640,y0:1200,y1:2390,name:'鉱山'},
  C:{x0:1770,x1:2330,y0:1200,y1:2390,name:'氷原'},
  D:{x0:80,x1:2320,y0:80,y1:590,name:'白熊の巣'},
};
const RES=['log','ore','pelt','meat'];
const RES_NAME={log:'丸太',meat:'肉',ore:'石',pelt:'毛皮',coin:'コイン',stew:'シチュー'};
const ZP=()=>({log:0,ore:0,pelt:0,meat:0,coin:0});

/* ================= pads (buildings, fences, upgrades, hires) ================= */
const one=c=>(l=>c);
const PADS=[
 {id:'furnace',name:'かまど',x:1200,y:1400,cost:one({log:10}),req:[],desc:'町の中心ができた'},
 {id:'grill',name:'肉焼き台',x:1040,y:1380,cost:one({log:15}),req:['furnace'],desc:'肉が2倍の値段で売れる'},
 {id:'house1',name:'家',x:790,y:1290,cost:one({log:20}),req:['furnace'],desc:'家賃が入るようになった'},
 {id:'lumber',name:'木こり小屋',x:900,y:1240,cost:one({coin:60}),req:['house1'],desc:'木こりが丸太を集めてくれる'},
 {id:'house2',name:'家',x:790,y:1420,cost:one({log:30}),req:['house1'],desc:'家賃アップ'},
 {id:'hunter',name:'狩人小屋',x:1500,y:1240,cost:one({coin:90}),req:['lumber'],desc:'狩人が肉を市場へ運ぶ'},
 {id:'mine',name:'鉱山を開拓',x:770,y:1570,cost:one({coin:150}),req:['grill'],desc:'西の鉱山に入れるようになった',fence:'B'},
 {id:'house3',name:'家',x:1620,y:1290,cost:one({log:40}),req:['house2'],desc:'家賃アップ'},
 {id:'minehut',name:'鉱夫小屋',x:800,y:1700,cost:one({coin:120,log:20}),req:['mine'],desc:'鉱夫が石を掘ってくれる'},
 {id:'smithy',name:'鍛冶屋',x:1350,y:1380,cost:one({log:30,ore:15}),req:['mine'],desc:'斧と防寒着を強化できる'},

 {id:'peltshop',name:'毛皮屋',x:1400,y:1530,cost:one({log:40,ore:10}),req:['ice'],desc:'毛皮が高く売れる'},

 {id:'house6',name:'家',x:780,y:1830,cost:one({log:80,ore:30,pelt:5}),req:['house5','ice'],desc:'家賃アップ'},

 {id:'warehouse',name:'倉庫',x:1000,y:1800,cost:one({log:40}),req:['house2'],desc:'素材を預けたり取り出したりできる'},
 {id:'trapper',name:'罠師小屋',x:1620,y:1760,cost:one({coin:250,log:30}),req:['ice'],desc:'罠師が狼を狩って毛皮を集める'},
 {id:'vault',name:'金庫',x:1400,y:1800,cost:one({coin:200,ore:15}),req:['house3','mine'],desc:'集金係がコインを集めて保管する'},
 {id:'wall',name:'村の壁',x:1090,y:1225,cost:one({log:50}),req:['house2'],desc:'壁と門で村を守る（門から出入りしよう）'},
 {id:'doghouse',name:'犬小屋',x:1500,y:1380,cost:one({log:20,meat:10}),req:['house1'],desc:'犬が落ちた物を拾ってきてくれる'},
 {id:'kitchen',name:'料理屋',x:1210,y:1830,cost:one({log:60,ore:20,coin:200}),req:['house3','mine'],desc:'肉と薪でシチューを作って高く売る'},
 {id:'arch1',name:'矢倉',x:1000,y:1160,cost:one({log:40,coin:100}),req:['wall'],desc:'襲撃者を矢で自動攻撃'},
 {id:'arch2',name:'矢倉',x:1420,y:1160,cost:one({log:40,coin:100}),req:['wall'],desc:'襲撃者を矢で自動攻撃'},
 {id:'arch3',name:'矢倉',x:690,y:1430,cost:one({log:50,coin:150}),req:['wall','arch1'],desc:'襲撃者を矢で自動攻撃'},
 {id:'arch4',name:'矢倉',x:1710,y:1430,cost:one({log:50,coin:150}),req:['wall','arch2'],desc:'襲撃者を矢で自動攻撃'},
 // repeatable upgrades (強化広場)
 {id:'axe',name:'斧',x:750,y:2140,max:7,cost:l=>({coin:Math.round(30*Math.pow(1.9,l)),ore:l>=2?5*l:0}),req:['grill'],up:true},
 {id:'bag',name:'カゴ',x:930,y:2140,max:8,cost:l=>({coin:Math.round(20*Math.pow(1.7,l))}),req:['furnace'],up:true},
 {id:'boots',name:'ブーツ',x:1110,y:2140,max:5,cost:l=>({coin:Math.round(40*Math.pow(1.8,l))}),req:['house1'],up:true},
 {id:'coat',name:'防寒着',x:1290,y:2140,max:5,cost:l=>({coin:Math.round(50*Math.pow(1.8,l)),pelt:l>=1?2*l:0}),req:['smithy'],up:true},
 {id:'sign',name:'看板(値上げ)',x:1470,y:2140,max:6,cost:l=>({coin:Math.round(60*Math.pow(2,l))}),req:['grill'],up:true},
 {id:'whup',name:'倉庫を拡張',x:1650,y:2140,max:4,cost:l=>({coin:Math.round(80*Math.pow(1.8,l)),log:20*(l+1)}),req:['warehouse'],up:true},
 {id:'hireL',name:'木こりを雇う',x:750,y:2260,max:3,cost:l=>({coin:Math.round(80*Math.pow(1.7,l))}),req:['lumber'],up:true},
 {id:'hireH',name:'狩人を雇う',x:930,y:2260,max:3,cost:l=>({coin:Math.round(100*Math.pow(1.7,l))}),req:['hunter'],up:true},
 {id:'hireM',name:'鉱夫を雇う',x:1110,y:2260,max:3,cost:l=>({coin:Math.round(120*Math.pow(1.7,l))}),req:['minehut'],up:true},
 {id:'hireT',name:'罠師を雇う',x:1290,y:2260,max:3,cost:l=>({coin:Math.round(150*Math.pow(1.7,l))}),req:['trapper'],up:true},
 {id:'hireP',name:'運搬係を雇う',x:1470,y:2260,max:2,cost:l=>({coin:Math.round(100*Math.pow(1.7,l))}),req:['warehouse'],up:true},
 {id:'hireC',name:'集金係を雇う',x:1650,y:2260,max:2,cost:l=>({coin:Math.round(150*Math.pow(1.7,l))}),req:['vault'],up:true},
 {id:'arrow',name:'矢の強化',x:930,y:2380,max:5,cost:l=>({coin:Math.round(100*Math.pow(1.8,l)),ore:10*(l+1)}),req:['arch1','mine'],up:true},
 {id:'gateup',name:'門の強化',x:1110,y:2380,max:4,cost:l=>({log:30*(l+1),ore:10*l,coin:50*(l+1)}),req:['wall'],up:true},
 {id:'dogup',name:'犬の訓練',x:1290,y:2380,max:3,cost:l=>({coin:Math.round(80*Math.pow(1.9,l)),meat:5*(l+1)}),req:['doghouse'],up:true},
 {id:'chef',name:'料理人を雇う',x:1470,y:2380,max:3,cost:l=>({coin:Math.round(150*Math.pow(1.7,l))}),req:['kitchen'],up:true},
];
for(const p of PADS)p.max=p.max||1;
const PADBY={};for(const p of PADS)PADBY[p.id]=p;
const TOTAL_LV=PADS.reduce((s,p)=>s+p.max,0);

const SHOPS=[
 {id:'market',name:'市場',type:'meat',x:1000,y:1530,side:-1,req:null,stock:0,cap:40,buyT:0,awn:'#e04646',pile:'pmk'},
 {id:'peltshop',name:'毛皮屋',type:'pelt',x:1400,y:1530,side:1,req:'peltshop',stock:0,cap:30,buyT:0,awn:'#3f78c4',pile:'ppe'},
 {id:'kitchen',name:'料理屋',type:'stew',x:1210,y:1830,side:1,req:'kitchen',stock:0,cap:20,buyT:0,awn:'#2d8c5a',pile:'pkt',q:{x:1285,y:1960,dx:0,dy:32},ing:{meat:0,log:0},cookT:0},
];
for(const s of SHOPS)s.drop={x:s.x,y:s.y+90};
const KITCHEN=SHOPS[2];
const PILES=[
 {id:'pmk',x:1090,y:1625,type:'coin',req:null},
 {id:'ppe',x:1490,y:1625,type:'coin',req:'peltshop'},
 {id:'plog',x:975,y:1300,type:'log',req:'lumber'},
 {id:'pore',x:875,y:1765,type:'ore',req:'minehut'},
 {id:'ppl',x:1540,y:1830,type:'pelt',req:'trapper'},
 {id:'pkt',x:1300,y:1895,type:'coin',req:'kitchen'},
];
const STORE_T=['log','ore','pelt','meat'];
const DEPO={x:1000,y:1890};
const WDZ=STORE_T.map((type,i)=>({type,x:830+i*90,y:1990}));
const VZ={x:1400,y:1890};
const RENT=[5,6,8,10,12,15];
for(let i=1;i<=6;i++){const h=PADBY['house'+i];PILES.push({id:'ph'+i,x:h.x+58,y:h.y+42,type:'coin',req:'house'+i,rent:RENT[i-1],rt:0})}

/* nodes: trees and rocks */
const nodes=[];
const mkNode=(kind,x,y)=>{const big=kind==='bigtree';nodes.push({kind,x,y,hp:kind==='rock'?4:big?6:3,max:kind==='rock'?4:big?6:3,alive:true,rt:0,wob:0})};
const nearPad=(x,y,r)=>PADS.some(p=>Math.hypot(p.x-x,p.y-y)<r);
for(let gy=ZONE.A.y0+20;gy<ZONE.A.y1;gy+=82)for(let gx=ZONE.A.x0+10;gx<ZONE.A.x1;gx+=92){if(rand()<.33)continue;const x=gx+rand()*50,y=gy+rand()*40;if(Math.abs(x-1200)<75||nearPad(x,y,90))continue;mkNode('tree',x,y)}
for(let gy=ZONE.D.y0+40;gy<ZONE.D.y1;gy+=125)for(let gx=ZONE.D.x0+20;gx<ZONE.D.x1;gx+=135){if(rand()<.35)continue;mkNode('bigtree',gx+rand()*60,gy+rand()*50)}
for(let gy=ZONE.B.y0+30;gy<ZONE.B.y1;gy+=105)for(let gx=ZONE.B.x0+30;gx<ZONE.B.x1;gx+=110){if(rand()<.4)continue;mkNode('rock',gx+rand()*50,gy+rand()*40)}
for(let i=0;i<14;i++)mkNode('tree',ZONE.C.x0+rand()*(ZONE.C.x1-ZONE.C.x0),ZONE.C.y0+rand()*(ZONE.C.y1-ZONE.C.y0));
for(let i=0;i<6;i++)mkNode('tree',ZONE.B.x0+rand()*(ZONE.B.x1-ZONE.B.x0),ZONE.B.y0+rand()*(ZONE.B.y1-ZONE.B.y0));
const bumps=[];for(let i=0;i<300;i++)bumps.push({x:rand()*WW,y:rand()*WH,r:20+rand()*50});

const WALL={x0:690,x1:1710,y0:1160};
const GATES=[
 {id:'top',vert:false,x:1200,y:1160,lo:1150,hi:1250,out:{x:1200,y:1112},inn:{x:1200,y:1212},hp:30,max:30,flash:0},
 {id:'left',vert:true,x:690,y:1560,lo:1510,hi:1610,out:{x:642,y:1560},inn:{x:742,y:1560},hp:30,max:30,flash:0},
 {id:'right',vert:true,x:1710,y:1560,lo:1510,hi:1610,out:{x:1758,y:1560},inn:{x:1658,y:1560},hp:30,max:30,flash:0},
];
const CENTER={x:1200,y:1445};
const inWalls=(x,y)=>x>WALL.x0&&x<WALL.x1&&y>WALL.y0;
function wallHit(x0,y0,x1,y1,canGate){
  if(!built('wall'))return false;
  if((y0<WALL.y0)!==(y1<WALL.y0)&&x1>WALL.x0-3&&x1<WALL.x1+3){const g=GATES[0];if(!(canGate(g)&&x1>g.lo&&x1<g.hi))return true}
  const sides=[[WALL.x0,GATES[1]],[WALL.x1,GATES[2]]];
  for(const[wx,g]of sides)if((x0<wx)!==(x1<wx)&&y1>WALL.y0-3){if(!(canGate(g)&&y1>g.lo&&y1<g.hi))return true}
  return false;
}
const TOWERS=['tower','arch1','arch2','arch3','arch4'];
const MISSIONS=[
 {txt:'木を10本切る',k:'tree',n:10,r:20},
 {txt:'クマを3頭倒す',k:'bear',n:3,r:30},
 {txt:'肉を10個売る',k:'sold_meat',n:10,r:40},
 {txt:'家を2軒建てる',k:'houses',n:2,r:50,abs:true},
 {txt:'村の壁を建てる',k:'wallb',n:1,r:80,abs:true},
 {txt:'木を30本切る',k:'tree',n:30,r:60},
 {txt:'襲撃を1回しのぐ',k:'raid',n:1,r:100},
 {txt:'犬小屋を建てる',k:'dogb',n:1,r:80,abs:true},
 {txt:'岩を15個掘る',k:'rock',n:15,r:80},
 {txt:'矢倉を2つ建てる',k:'archb',n:2,r:150,abs:true},
 {txt:'襲撃者を20体倒す',k:'raider',n:20,r:150},
 {txt:'狼を10匹倒す',k:'wolf',n:10,r:120},
 {txt:'毛皮を10枚売る',k:'sold_pelt',n:10,r:150},
 {txt:'料理屋を建てる',k:'kitb',n:1,r:150,abs:true},
 {txt:'シチューを10皿売る',k:'sold_stew',n:10,r:200},
 {txt:'補給物資を3個拾う',k:'crate',n:3,r:150},
 {txt:'白熊を1頭倒す',k:'polar',n:1,r:300},
 {txt:'襲撃を5回しのぐ',k:'raid',n:5,r:400},
 {txt:'クマを30頭倒す',k:'bear',n:30,r:400},
];
const MTPL=[['tree','木を%本切る',2],['bear','クマを%頭倒す',8],['sold_meat','肉を%個売る',3],['wolf','狼を%匹倒す',6],['rock','岩を%個掘る',4],['raider','襲撃者を%体倒す',8],['sold_stew','シチューを%皿売る',10]];
function curMission(){
  if(mis<MISSIONS.length)return MISSIONS[mis];
  const j=mis-MISSIONS.length,tp=MTPL[j%MTPL.length],n=10+Math.floor(j/MTPL.length)*10;
  return{txt:tp[1].replace('%',n),k:tp[0],n,r:n*tp[2]};
}
function absStat(k){
  if(k==='houses')return[1,2,3,4,5,6].filter(i=>built('house'+i)).length;
  if(k==='wallb')return lv.wall;if(k==='dogb')return lv.doghouse;if(k==='kitb')return lv.kitchen;
  if(k==='archb')return['arch1','arch2','arch3','arch4'].filter(built).length;
  return 0;
}
const misProg=m=>m.abs?absStat(m.k):(stats[m.k]||0)-misBase;
const ET={
  bear:{hp:6,sp:40,chase:88,dmg:1,cd:1.1,size:1,drop:{meat:3},zone:'A',aggro:230,resp:12,n:7},
  wolf:{hp:4,sp:60,chase:150,dmg:1,cd:.8,size:.75,drop:{pelt:1,meat:1},zone:'C',aggro:260,resp:10,n:7},
  polar:{hp:60,sp:30,chase:72,dmg:3,cd:1.5,size:1.8,drop:{meat:6,pelt:4},zone:'D',aggro:250,resp:40,n:3},
  raider:{hp:6,sp:95,chase:95,dmg:1,cd:1,size:.85,drop:{},zone:'A',aggro:150,resp:0,n:0},
};

/* ================= state ================= */
let stats,mis,misBase,raid,raiders,arrows,dog,store,vaultN,P,money,lv,paid,enemies,items,flyers,parts,texts,customers,npcs,pileN,crate,crateT,t=0,toastT=0,toastMsg='',started=false,won=false,saveT=0;
let arrowDmg,arrowInt,storeCap,dmg,atkInt,cap,speed,priceMult,meatPrice,peltPrice;
const built=id=>lv[id]>=1;
function recompute(){
  const a=lv.axe;dmg=1+a;atkInt=.45*Math.pow(.9,a);
  cap=8+4*lv.bag;speed=215*(1+.08*lv.boots);
  const mh=10+6*lv.coat;if(P){P.hp=Math.min(mh,P.hp+(mh-P.maxHp));P.maxHp=mh}
  storeCap=60+60*lv.whup;arrowDmg=Math.round(2+1.5*lv.arrow);arrowInt=1.1*Math.pow(.88,lv.arrow);
  for(const g of GATES){g.max=30+25*lv.gateup;if(!raid||!raid.active)g.hp=g.max}
  priceMult=1+.25*lv.sign;meatPrice=Math.round(5*(built('grill')?2:1)*priceMult);peltPrice=Math.round(20*priceMult);
}
const priceOf=type=>type==='meat'?meatPrice:type==='stew'?Math.round(40*priceMult):peltPrice;
const stat=(k,n=1)=>{stats[k]=(stats[k]||0)+n};
function spawnEnemy(type,far){
  const z=ZONE[ET[type].zone];let x,y;
  for(let k=0;k<25;k++){x=R(z.x0+40,z.x1-40);y=R(z.y0+40,z.y1-40);if(!far||!P||Math.hypot(x-P.x,y-P.y)>450)break}
  const e=ET[type];return{type,x,y,hp:e.hp,max:e.hp,alive:true,tx:x,ty:y,atkT:0,flash:0,rt:0,face:1,walk:0};
}
function reset(){
  P={x:1200,y:1560,face:1,stack:[],hp:10,maxHp:10,atkT:0,hurtT:0,lastHit:9,swing:0,walk:0,moving:false};
  money=0;won=false;lv={};paid={};for(const p of PADS){lv[p.id]=0;paid[p.id]=ZP()}
  enemies=[];for(const k in ET)for(let i=0;i<ET[k].n;i++)enemies.push(spawnEnemy(k,false));
  items=[];flyers=[];parts=[];texts=[];npcs=[];pileN={};for(const p of PILES)pileN[p.id]=0;

  for(const n of nodes){n.alive=true;n.hp=n.max}

const shopOpen=s=>!s.req||built(s.req);
const pileOn=p=>!p.req||built(p.req);
function syncNPCs(){
  const want={lumber:(built('lumber')?1:0)+lv.hireL,hunter:(built('hunter')?1:0)+lv.hireH,miner:(built('minehut')?1:0)+lv.hireM,
    trapper:(built('trapper')?1:0)+lv.hireT,porter:(built('warehouse')?1:0)+lv.hireP,collector:(built('vault')?1:0)+lv.hireC};

  }
}

const KEY='snow-town-v2';

function load(){

    for(const id in d.lv||{})if(id in lv)lv[id]=d.lv[id];
    for(const id in d.paid||{})if(id in paid)paid[id]=Object.assign(ZP(),d.paid[id]);
    money=d.money||0;(d.stock||[]).forEach((n,i)=>{if(SHOPS[i])SHOPS[i].stock=n});
    Object.assign(pileN,d.pileN||{});Object.assign(store,d.store||{});vaultN=d.vaultN||0;
    stats=d.stats||{};mis=d.mis||0;misBase=d.misBase||0;if(d.raid){raid.no=d.raid.no||0;raid.t=d.raid.t==null?null:Math.max(60,d.raid.t)}Object.assign(KITCHEN.ing,d.ing||{});

/* ================= helpers ================= */
const visible=p=>p.req.every(built)&&lv[p.id]<p.max;
function addText(x,y,s,c){texts.push({x,y,s,c,life:1})}
function toast(s){toastMsg=s;toastT=2.8}
function puff(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-60,60),vy:R(-90,-10),life:R(.4,.8),c,r:R(2,5)})}
function dropItem(x,y,type){items.push({x:x+R(-30,30),y:y+R(-15,22),type,z:0,vz:R(140,220),age:0})}
function takeTop(type){for(let i=P.stack.length-1;i>=0;i--)if(P.stack[i]===type){P.stack.splice(i,1);return true}return false}
function fly(x0,y0,type){flyers.push({x0,y0,type,k:0})}
function flyTo(x0,y0,x1,y1,type){flyers.push({x0,y0,x1,y1,type,k:0,abs:true})}
function locked(x,y){return(!built('mine')&&x<680&&y>1150)||(!built('ice')&&x>1720&&y>1150)||(!built('polar')&&y<640)}
function inTown(x,y){return y>1150&&x>=680&&x<=1720}
const devPct=()=>Math.round(PADS.reduce((s,p)=>s+lv[p.id],0)/TOTAL_LV*100);
function costOf(p){const c=p.cost(lv[p.id]);const o={};for(const k of['log','ore','pelt','meat','coin'])if(c[k])o[k]=c[k];return o}

function levelUp(p){

    const d={axe:`攻撃力 ${dmg}`,bag:`持てる数 ${cap}`,boots:'移動が速くなった',coat:`体力 ${P.maxHp}`,sign:`肉 ${meatPrice} / 毛皮 ${peltPrice} コイン`,hireL:'木こりが増えた',hireH:'狩人が増えた',hireM:'鉱夫が増えた',hireT:'罠師が増えた',hireP:'運搬係が増えた',hireC:'集金係が増えた',whup:`倉庫の容量 ${storeCap}`,arrow:`矢の威力 ${arrowDmg}`,gateup:`門の耐久 ${GATES[0].max}`,dogup:'犬がたくさん運べる',chef:'料理が速くなった'}[p.id]||'';
    toast(p.name+' Lv'+lv[p.id]+'：'+d);

function hurtP(d){
  P.hp-=d;P.hurtT=.3;P.lastHit=0;addText(P.x,P.y-60,'-'+d,'#ff6060');
  if(P.hp<=0){for(const s of P.stack)dropItem(P.x,P.y,s);P.stack=[];P.x=1200;P.y=1560;P.hp=P.maxHp;toast('やられた…町に戻った（荷物はその場に落ちた）')}
}
function walkVia(o,x,y,sp,dt){
  if(built('wall')&&inWalls(o.x,o.y)!==inWalls(x,y)){
    const out=inWalls(x,y)?o:{x,y};
    const g=out.y<WALL.y0?GATES[0]:out.x<WALL.x0?GATES[1]:GATES[2];
    const inside=inWalls(o.x,o.y),a=inside?g.inn:g.out,b=inside?g.out:g.inn;
    if(!o.via&&walkTo(o,a.x,a.y,sp,dt)<10)o.via=true;
    if(o.via&&walkTo(o,b.x,b.y,sp,dt)<6)o.via=false;
    return 1e9;
  }
  o.via=false;return walkTo(o,x,y,sp,dt);
}
function startRaid(){
  raid.active=true;raid.stolen=0;
  const n=Math.min(18,3+raid.no*2),sp=[{x:[900,1500],y:[720,760]}];
  if(built('mine'))sp.push({x:[200,450],y:[1450,1650]});if(built('ice'))sp.push({x:[1950,2200],y:[1450,1650]});
  for(let i=0;i<n;i++){
    const s=sp[i%sp.length],x=R(s.x[0],s.x[1]),y=R(s.y[0],s.y[1]);
    const gate=y<WALL.y0?GATES[0]:x<WALL.x0?GATES[1]:GATES[2];
    raiders.push({type:'raider',x,y,hp:5+raid.no*2,max:5+raid.no*2,alive:true,atkT:0,flash:0,face:1,walk:0,gate,dmg:1+Math.floor(raid.no/3),sp:R(85,105)});
  }
  toast('襲撃だ！ 狼の群れが村に向かってくる！');
}
function endRaid(){
  raid.active=false;raiders=[];raid.no++;stat('raid');
  for(const g of GATES)g.hp=g.max;
  if(raid.stolen===0){const b=30+raid.no*20;money+=b;toast(`襲撃をしのいだ！ ボーナス +${b}`);addText(P.x,P.y-80,'+'+b,'#ffd34d')}
  else toast(`襲撃は終わった…（${raid.stolen}コイン盗まれた）`);
  raid.t=R(150,210);save();
}

/* ================= update ================= */
function update(dt){
  t+=dt;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt}parts=parts.filter(p=>p.life>0);
  for(const x of texts){x.life-=dt*.9;x.y-=40*dt}texts=texts.filter(x=>x.life>0);
  for(const f of flyers)f.k+=dt*4;flyers=flyers.filter(f=>f.k<1);
  toastT-=dt;
  if(!started)return;

  /* player move */
  let mx=0,my=0;
  if(keys.arrowleft||keys.a)mx--;if(keys.arrowright||keys.d)mx++;if(keys.arrowup||keys.w)my--;if(keys.arrowdown||keys.s)my++;
  if(joy.on){const dx=joy.cx-joy.bx,dy=joy.cy-joy.by,l=Math.hypot(dx,dy);if(l>5){const k=Math.min(1,l/45);mx+=dx/l*k;my+=dy/l*k}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  P.moving=ml>.1;
  const OPEN=()=>true;
  const nx=clamp(P.x+mx*speed*dt,30,WW-30);if(!locked(nx,P.y)&&!wallHit(P.x,P.y,nx,P.y,OPEN))P.x=nx;
  const ny=clamp(P.y+my*speed*dt,60,WH-25);if(!locked(P.x,ny)&&!wallHit(P.x,P.y,P.x,ny,OPEN))P.y=ny;
  if(P.moving)P.walk+=dt*12;if(Math.abs(mx)>.15)P.face=mx>0?1:-1;
  P.swing=Math.max(0,P.swing-dt*4);P.hurtT=Math.max(0,P.hurtT-dt);P.lastHit+=dt;
  if(P.lastHit>3||inTown(P.x,P.y))P.hp=Math.min(P.maxHp,P.hp+dt*(inTown(P.x,P.y)?4:1.5));

  /* auto attack / gather */
  P.atkT-=dt;
  if(P.atkT<=0){
    let tg=null,bd=1e9;
    for(const e of enemies.concat(raiders))if(e.alive){const d=dist(e,P)-28*ET[e.type].size;if(d<48&&d<bd){bd=d;tg=e}}
    if(tg){
      P.atkT=atkInt;P.swing=1;P.face=tg.x>P.x?1:-1;hitEnemy(tg,dmg,true);
    }else{
      let tn=null,td=1e9;
      for(const n of nodes)if(n.alive){const d=dist(n,P)-(n.kind==='bigtree'?12:0);if(d<62&&d<td){td=d;tn=n}}
      if(tn){P.atkT=atkInt;P.swing=1;P.face=tn.x>P.x?1:-1;hitNode(tn,dmg,true)}
    }
  }

  for(const n of nodes){n.wob=Math.max(0,n.wob-dt);if(!n.alive){n.rt-=dt;if(n.rt<=0&&dist(n,P)>90){n.alive=true;n.hp=n.max}}}

  /* enemies */
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i],cf=ET[e.type],z=ZONE[cf.zone];
    if(!e.alive){e.rt-=dt;if(e.rt<=0)enemies[i]=spawnEnemy(e.type,true);continue}
    e.flash=Math.max(0,e.flash-dt);e.atkT-=dt;
    const d=dist(e,P),reach=30*cf.size+22,aggro=d<cf.aggro&&!inTown(P.x,P.y);
    let tx=e.tx,ty=e.ty,sp=cf.sp;
    if(aggro){tx=P.x;ty=P.y;sp=cf.chase}
    else if(Math.hypot(e.tx-e.x,e.ty-e.y)<10){e.tx=R(z.x0+40,z.x1-40);e.ty=R(z.y0+40,z.y1-40)}
    const dx=tx-e.x,dy=ty-e.y,l=Math.hypot(dx,dy);
    if(l>(aggro?reach-6:4)){e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;e.walk+=dt*(e.type==='wolf'?14:8);if(Math.abs(dx)>3)e.face=dx>0?1:-1}
    e.x=clamp(e.x,z.x0-40,z.x1+40);e.y=clamp(e.y,z.y0-40,z.y1+40);
    if(aggro&&d<reach&&e.atkT<=0){
      e.atkT=cf.cd;hurtP(cf.dmg);
    }
  }

  /* ground items */
  for(const it of items){
    it.age+=dt;if(it.z>0||it.vz>0){it.vz-=600*dt;it.z=Math.max(0,it.z+it.vz*dt);if(it.z===0)it.vz=0}
    if(it.dead)continue;
    if(it.age>.35&&P.stack.length<cap&&dist(it,P)<62){it.dead=true;P.stack.push(it.type);fly(it.x,it.y,it.type)}
    if(it.age>120)it.dead=true;
  }
  items=items.filter(i=>!i.dead);

  /* shops */
  for(const s of SHOPS){
    if(!shopOpen(s))continue;
    if(Math.hypot(P.x-s.drop.x,P.y-s.drop.y)<55){
      s.dropT=(s.dropT||0)+dt;
      if(s.ing)while(s.dropT>.07){s.dropT-=.07;let k=null;if(s.ing.meat<30&&takeTop('meat'))k='meat';else if(s.ing.log<15&&takeTop('log'))k='log';if(!k)break;s.ing[k]++;flyTo(P.x,P.y-50,s.x,s.y-30,k)}
      else while(s.dropT>.07){s.dropT-=.07;if(s.stock<s.cap&&takeTop(s.type)){s.stock++;flyTo(P.x,P.y-50,s.x,s.y-30,s.type)}else break}
    }
    if(s.ing){s.cookT+=dt*(1+.6*lv.chef);while(s.cookT>2.5){s.cookT-=2.5;if(s.ing.meat>=2&&s.ing.log>=1&&s.stock<s.cap){s.ing.meat-=2;s.ing.log--;s.stock++;puff(s.x,s.y-80,6,'rgba(255,255,255,.8)')}}}
    const q=customers.filter(c=>c.shop===s&&!c.out);
    q.forEach((c,i)=>{const sp=slotPos(s,i);walkTo(c,sp.x,sp.y,95,dt)});
    const f=q[0],s0=slotPos(s,0);
    if(f&&Math.hypot(f.x-s0.x,f.y-s0.y)<4&&s.stock>0){
      s.buyT+=dt;
      if(s.buyT>.5){s.buyT=0;const k=Math.min(s.stock,1+Math.floor(lv.sign/2));s.stock-=k;f.out=true;f.carry=s.type;stat('sold_'+s.type,k);const g=priceOf(s.type)*k;pileN[s.pile]+=g;addText(s.x+s.side*50,s.y-40,'+'+g,'#ffd34d')}
    }
    while(customers.filter(c=>c.shop===s&&!c.out).length<4)customers.push({shop:s,x:s.q?s.q.x+R(-10,10):s.x+s.side*R(80,140),y:WH+30,col:CCOL[Math.floor(Math.random()*CCOL.length)],out:false,walk:Math.random()*6,carry:null});
  }
  for(const c of customers)if(c.out){walkTo(c,c.shop.q?c.shop.q.x+50:c.shop.x+c.shop.side*170,WH+50,100,dt);if(c.y>WH+40)c.gone=true}
  customers=customers.filter(c=>!c.gone);

  /* piles */
  for(const p of PILES){
    if(!pileOn(p))continue;
    if(p.rent){p.rt+=dt;if(p.rt>6){p.rt=0;if(pileN[p.id]<p.rent*20)pileN[p.id]+=Math.round(p.rent*priceMult)}}
    if(pileN[p.id]<=0||Math.hypot(P.x-p.x,P.y-p.y)>55)continue;
    if(p.type==='coin'){const a=Math.max(1,Math.ceil(pileN[p.id]/12));pileN[p.id]-=a;money+=a;if(Math.random()<.6)flyTo(p.x,p.y-10,P.x,P.y-40,'coin')}
    else if(P.stack.length<cap){p.ptT=(p.ptT||0)+dt;while(p.ptT>.06&&pileN[p.id]>0&&P.stack.length<cap){p.ptT-=.06;pileN[p.id]--;P.stack.push(p.type);fly(p.x,p.y-10,p.type)}}
  }

  /* warehouse & vault */
  if(built('warehouse')){
    if(Math.hypot(P.x-DEPO.x,P.y-DEPO.y)<50){
      wT+=dt;
      while(wT>.05&&P.stack.length){wT-=.05;let ok=false;for(let i=P.stack.length-1;i>=0;i--){const k=P.stack[i];if(store[k]<storeCap){store[k]++;P.stack.splice(i,1);flyTo(P.x,P.y-50,DEPO.x,DEPO.y-60,k);ok=true;break}}if(!ok){wT=0;break}}
    }else for(const z of WDZ)if(Math.abs(P.x-z.x)<32&&Math.abs(P.y-z.y)<26){
      wT+=dt;while(wT>.06&&store[z.type]>0&&P.stack.length<cap){wT-=.06;store[z.type]--;P.stack.push(z.type);fly(z.x,z.y-10,z.type)}
    }
  }
  if(built('vault')&&vaultN>0&&Math.hypot(P.x-VZ.x,P.y-VZ.y)<50){const a=Math.max(1,Math.ceil(vaultN/10));vaultN-=a;money+=a;if(Math.random()<.6)flyTo(VZ.x,VZ.y-30,P.x,P.y-40,'coin')}

  /* pads */
  for(const p of PADS){
    if(!visible(p))continue;
    if(Math.abs(P.x-p.x)<50&&Math.abs(P.y-p.y)<36){
      p.st=(p.st||0)+dt;if(p.st<.3)continue;
      p.payT=(p.payT||0)+dt;const need=costOf(p),pd=paid[p.id];
      while(p.payT>.05){
        p.payT-=.05;let moved=false;
        for(const r of RES)if(need[r]&&pd[r]<need[r]&&takeTop(r)){pd[r]++;moved=true;flyTo(P.x,P.y-50,p.x,p.y,r);break}
        if(!moved&&need.coin&&pd.coin<need.coin&&money>0){const a=Math.min(money,need.coin-pd.coin,Math.max(1,Math.ceil(need.coin/30)));money-=a;pd.coin+=a;moved=true;if(Math.random()<.5)flyTo(P.x,P.y-40,p.x,p.y,'coin')}
        if(Object.keys(need).every(k=>pd[k]>=need[k])){levelUp(p);break}
        if(!moved){p.payT=0;break}
      }
    }else{p.payT=0;p.st=0}
  }

  /* npcs */
  for(const n of npcs){
    n.swing=Math.max(0,n.swing-dt*4);n.atkT-=dt;
    if(n.kind==='lumber'||n.kind==='miner'){
      const home=n.kind==='lumber'?PILES.find(p=>p.id==='plog'):PILES.find(p=>p.id==='pore'),want=n.kind==='lumber'?'tree':'rock';
      if(n.state==='seek'){
        if(!n.tg||!n.tg.alive){let bd=1e9;n.tg=null;for(const nd of nodes)if(nd.alive&&nd.kind===want&&(want==='rock'||nd.y>ZONE.A.y0)){const d=Math.hypot(nd.x-home.x,nd.y-home.y);if(d<bd&&!npcs.some(o=>o!==n&&o.tg===nd)){bd=d;n.tg=nd}}}
        if(n.tg&&walkVia(n,n.tg.x-30,n.tg.y+8,115,dt)<6&&n.atkT<=0){n.atkT=.8;n.swing=1;n.face=1;n.tg.hp--;n.tg.wob=.3;puff(n.tg.x,n.tg.y-25,4,n.kind==='miner'?'#c9d3dd':'#fff');if(n.tg.hp<=0){killNode(n.tg);n.carry=2;n.state='ret'}}
      }else if(walkVia(n,home.x,home.y-12,115,dt)<6){if(pileN[home.id]<60)pileN[home.id]+=n.carry;n.carry=0;n.state='seek';n.tg=null}
    }else if(n.kind==='trapper'){
      const home=PILES.find(p=>p.id==='ppl');
      if(n.state==='seek'){
        if(!n.tg||!n.tg.alive||!enemies.includes(n.tg)){let bd=1e9;n.tg=null;for(const e of enemies)if(e.alive&&e.type==='wolf'&&!npcs.some(o=>o!==n&&o.tg===e)){const d=Math.hypot(e.x-n.x,e.y-n.y);if(d<bd){bd=d;n.tg=e}}}
        if(n.tg&&walkVia(n,n.tg.x-34,n.tg.y+6,135,dt)<10&&n.atkT<=0){n.atkT=.6;n.swing=1;n.face=1;hitEnemy(n.tg,2,false);if(!n.tg.alive){n.carry=2;n.state='ret'}}
      }else if(walkVia(n,home.x,home.y-12,135,dt)<8){if(pileN.ppl<60)pileN.ppl+=n.carry;n.carry=0;n.state='seek';n.tg=null}
    }else if(n.kind==='porter'){
      if(n.state==='seek'){
        if(!n.tg||pileN[n.tg.id]<=0){let bn=0;n.tg=null;for(const p of PILES)if(p.type!=='coin'&&pileOn(p)&&pileN[p.id]>bn&&store[p.type]<storeCap&&!npcs.some(o=>o!==n&&o.tg===p)){bn=pileN[p.id];n.tg=p}}
        if(n.tg){if(walkTo(n,n.tg.x,n.tg.y+14,130,dt)<8){const k=Math.min(pileN[n.tg.id],10,storeCap-store[n.tg.type]);pileN[n.tg.id]-=k;n.carry=k;n.ctype=n.tg.type;n.state='ret';n.tg=null}}
        else walkTo(n,DEPO.x+60,DEPO.y-10,90,dt);

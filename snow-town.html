<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雪原の町づくり</title>
<style>
  html,body{margin:0;height:100%;background:#e9f2f9;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(14,40,70,.6);padding:24px;box-sizing:border-box}
  #ov.hide{display:none}
  #ov h1{font-size:34px;margin:0 0 12px;text-shadow:0 3px 0 #1b4f8a}
  #ov p{margin:0 0 22px;font-size:15px;line-height:1.7;max-width:330px}
  #ov button{font:inherit;font-size:21px;font-weight:800;color:#fff;background:linear-gradient(#ffb340,#f07a12);border:0;border-bottom:5px solid #b4520a;border-radius:16px;padding:13px 36px;margin:6px;cursor:pointer;min-width:200px}
  #ov button.sub{font-size:14px;background:none;border:0;text-decoration:underline;min-width:0;padding:6px}
  #ov button:active{transform:translateY(3px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov">
  <h1 id="ovT">雪原の町づくり</h1>
  <p id="ovP">木に近づくと自動で伐採、クマに近づくと自動で攻撃！<br>肉は<b>市場</b>に運ぶと売れてお金になる。<br>丸太とお金で建物を建てて、町を大きくしよう。</p>
  <button id="ovB">はじめる</button>
  <button id="ovR" class="sub" style="display:none">最初からやり直す</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB'),ovR=document.getElementById('ovR');
const FONT='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
let W,H,DPR,Z;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  Z=Math.max(.7,Math.min(1.25,Math.min(W,H)/500));
}
addEventListener('resize',resize);resize();
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.rect(x,y,w,h)};

/* ================= world ================= */
const WW=1500,WH=1450,SPD=215;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const R=(a,b)=>a+Math.random()*(b-a);
let seed=11;const rand=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const TOWN={x:760,y:1120};
const FOREST={x0:110,x1:1390,y0:110,y1:640};

const trees=[];
const mkTree=(x,y)=>trees.push({x,y,hp:3,max:3,alive:true,rt:0,wob:0});
for(let gy=FOREST.y0+30;gy<FOREST.y1;gy+=82)for(let gx=FOREST.x0+20;gx<FOREST.x1;gx+=92){if(rand()<.33)continue;mkTree(gx+rand()*50,gy+rand()*40)}
for(let gy=700;gy<1420;gy+=88){if(rand()<.8)mkTree(60+rand()*140,gy+rand()*30);if(rand()<.8)mkTree(1300+rand()*140,gy+rand()*30)}
const bumps=[];for(let i=0;i<160;i++)bumps.push({x:rand()*WW,y:rand()*WH,r:20+rand()*50});

/* ================= state ================= */
let P,money,cap,atkInt,dmg,price,bears,items,flyers,parts,texts,customers,npcs,piles,built,t=0,toastT=0,toastMsg='',started=false,won=false,saveT=0;
const MK={x:500,y:1080,meat:0,cap:40,buyT:0};
const DROP={x:500,y:1170};
const PADS=[
 {id:'furnace',name:'かまど',x:760,y:985,need:{log:10},req:[],desc:'町の中心'},
 {id:'grill',name:'肉焼き台',x:610,y:960,need:{log:15},req:['furnace'],desc:'肉が2倍の値段に'},
 {id:'bag',name:'大きなカゴ',x:660,y:1290,need:{coin:25},req:['furnace'],desc:'持てる数 8→14'},
 {id:'house1',name:'家',x:970,y:1130,need:{log:20},req:['furnace'],desc:'家賃が入る'},
 {id:'axe',name:'鋭い斧',x:770,y:1290,need:{coin:40},req:['grill'],desc:'伐採・攻撃が速く強く'},
 {id:'house2',name:'家',x:1090,y:1030,need:{log:25},req:['house1'],desc:'家賃が入る'},
 {id:'lumber',name:'木こり小屋',x:320,y:880,need:{coin:60},req:['house1'],desc:'木こりが丸太を集める'},
 {id:'hunter',name:'狩人小屋',x:1130,y:850,need:{coin:90},req:['lumber'],desc:'狩人が肉を市場へ'},
 {id:'house3',name:'家',x:960,y:930,need:{log:35},req:['house2'],desc:'家賃が入る'},
 {id:'bag2',name:'特大カゴ',x:880,y:1290,need:{coin:120},req:['bag','axe'],desc:'持てる数 14→22'},
 {id:'tower',name:'見張り塔',x:760,y:790,need:{log:50},req:['house3','hunter'],desc:'町の完成！'},
];
const LOGPILE={x:390,y:950};

function newBear(far){
  let x,y;for(let k=0;k<20;k++){x=R(FOREST.x0+40,FOREST.x1-40);y=R(FOREST.y0+40,FOREST.y1-60);if(!far||!P||Math.hypot(x-P.x,y-P.y)>420)break}
  return{x,y,hp:6,max:6,alive:true,tx:x,ty:y,atkT:0,flash:0,rt:0,face:1,walk:0};
}
function reset(){
  P={x:TOWN.x,y:TOWN.y+60,face:1,stack:[],hp:10,maxHp:10,atkT:0,hurtT:0,lastHit:9,swing:0,walk:0,moving:false};
  money=0;cap=8;atkInt=.45;dmg=1;price=5;won=false;
  bears=[];for(let i=0;i<5;i++)bears.push(newBear(false));
  items=[];flyers=[];parts=[];texts=[];npcs=[];
  piles=[{x:590,y:1170,n:0,type:'coin'}];
  customers=[];for(let i=0;i<4;i++)customers.push(newCustomer(slotPos(i).x,slotPos(i).y));
  built=new Set();MK.meat=0;
  for(const p of PADS)p.paid={log:0,coin:0};
  for(const tr of trees){tr.alive=true;tr.hp=tr.max}
}
const slotPos=i=>({x:MK.x-75-i*32,y:MK.y+35});
const CCOL=['#5aa9e6','#7bc96f','#e86fa6','#9b7be0','#4fc3b5','#e0a33a'];
function newCustomer(x,y){return{x,y,col:CCOL[Math.floor(Math.random()*CCOL.length)],out:false,walk:Math.random()*6,carry:false}}

/* ================= save ================= */
const KEY='snow-town-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({money,built:[...built],paid:PADS.map(p=>p.paid),meat:MK.meat,piles:piles.map(p=>p.n)}))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return false;
    reset();
    for(const id of d.built||[])build(PADS.find(p=>p.id===id),true);
    (d.paid||[]).forEach((pd,i)=>{if(PADS[i]&&pd)PADS[i].paid=pd});
    money=d.money||0;MK.meat=d.meat||0;
    (d.piles||[]).forEach((n,i)=>{if(piles[i])piles[i].n=n});
    return true;
  }catch(e){return false}
}
function hasSave(){try{return!!localStorage.getItem(KEY)}catch(e){return false}}

/* ================= input ================= */
const joy={on:false,bx:0,by:0,cx:0,cy:0,id:null};
cv.addEventListener('pointerdown',e=>{joy.on=true;joy.id=e.pointerId;joy.bx=joy.cx=e.clientX;joy.by=joy.cy=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){joy.cx=e.clientX;joy.cy=e.clientY}});
const jup=e=>{if(e.pointerId===joy.id)joy.on=false};cv.addEventListener('pointerup',jup);cv.addEventListener('pointercancel',jup);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ================= helpers ================= */
const visible=p=>p.req.every(r=>built.has(r))&&!built.has(p.id);
function addText(x,y,s,c){texts.push({x,y,s,c,life:1})}
function toast(s){toastMsg=s;toastT=2.6}
function puff(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-60,60),vy:R(-90,-10),life:R(.4,.8),c,r:R(2,5)})}
function dropItem(x,y,type){items.push({x:x+R(-25,25),y:y+R(-15,20),type,z:0,vz:R(140,220),age:0})}
function takeTop(type){for(let i=P.stack.length-1;i>=0;i--)if(P.stack[i]===type){P.stack.splice(i,1);return true}return false}
function fly(x0,y0,x1,y1,type){flyers.push({x0,y0,x1,y1,type,k:0})}

function build(p,silent){
  built.add(p.id);
  const id=p.id;
  if(id==='grill')price=10;
  if(id==='bag')cap=Math.max(cap,14);
  if(id==='bag2')cap=22;
  if(id==='axe'){atkInt=.28;dmg=2}
  if(id.startsWith('house'))piles.push({x:p.x+58,y:p.y+40,n:0,type:'coin',rent:0});
  if(id==='lumber'){piles.push({x:LOGPILE.x,y:LOGPILE.y,n:0,type:'log'});npcs.push({kind:'lumber',x:p.x,y:p.y+40,hx:LOGPILE.x,hy:LOGPILE.y,state:'seek',tg:null,atkT:0,walk:0,face:1,swing:0,carry:0})}
  if(id==='hunter')npcs.push({kind:'hunter',x:p.x,y:p.y+40,state:'seek',tg:null,atkT:0,walk:0,face:1,swing:0,carry:0});
  if(!silent){
    puff(p.x,p.y-20,30,'#fff');puff(p.x,p.y-20,16,'#ffd34d');
    addText(p.x,p.y-90,p.name+' 完成！','#ffd34d');
    if(p.desc&&id!=='tower')toast(p.name+'：'+p.desc);
    if(id==='tower'){won=true;setTimeout(()=>{ovT.textContent='町が完成！';ovP.innerHTML='見張り塔が建って、雪原の町は安全になった！<br>このまま遊び続けることもできるよ。';ovB.textContent='遊び続ける';ovR.style.display='';ov.classList.remove('hide')},900)}
    save();
  }
}

/* ================= update ================= */
function update(dt){
  t+=dt;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt}parts=parts.filter(p=>p.life>0);
  for(const x of texts){x.life-=dt*.9;x.y-=40*dt}texts=texts.filter(x=>x.life>0);
  for(const f of flyers)f.k+=dt*4;flyers=flyers.filter(f=>f.k<1);
  toastT-=dt;
  if(!started)return;

  /* player move */
  let mx=0,my=0;
  if(keys.arrowleft||keys.a)mx--;if(keys.arrowright||keys.d)mx++;if(keys.arrowup||keys.w)my--;if(keys.arrowdown||keys.s)my++;
  if(joy.on){const dx=joy.cx-joy.bx,dy=joy.cy-joy.by,l=Math.hypot(dx,dy);if(l>5){const k=Math.min(1,l/45);mx+=dx/l*k;my+=dy/l*k}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  P.moving=ml>.1;
  P.x=clamp(P.x+mx*SPD*dt,30,WW-30);P.y=clamp(P.y+my*SPD*dt,70,WH-25);
  if(P.moving)P.walk+=dt*12;if(Math.abs(mx)>.15)P.face=mx>0?1:-1;
  P.swing=Math.max(0,P.swing-dt*4);P.hurtT=Math.max(0,P.hurtT-dt);P.lastHit+=dt;
  if(P.lastHit>3)P.hp=Math.min(P.maxHp,P.hp+dt*1.5);

  /* auto attack / chop */
  P.atkT-=dt;
  if(P.atkT<=0){
    let tg=null,bd=75;
    for(const b of bears)if(b.alive){const d=dist(b,P);if(d<bd){bd=d;tg=b}}
    if(tg){
      P.atkT=atkInt;P.swing=1;P.face=tg.x>P.x?1:-1;
      tg.hp-=dmg;tg.flash=.15;const d=Math.max(1,bd);tg.x+=(tg.x-P.x)/d*12;tg.y+=(tg.y-P.y)/d*12;
      puff(tg.x,tg.y-20,5,'#ffffff');addText(tg.x,tg.y-55,'-'+dmg,'#ffeb7a');
      if(tg.hp<=0){tg.alive=false;tg.rt=12;puff(tg.x,tg.y-15,18,'#ffffff');for(let i=0;i<3;i++)dropItem(tg.x,tg.y,'meat')}
    }else{
      let tt=null,td=62;
      for(const tr of trees)if(tr.alive){const d=dist(tr,P);if(d<td){td=d;tt=tr}}
      if(tt){
        P.atkT=atkInt;P.swing=1;P.face=tt.x>P.x?1:-1;
        tt.hp-=dmg;tt.wob=.3;puff(tt.x,tt.y-30,6,'#ffffff');
        if(tt.hp<=0)fellTree(tt,true);
      }
    }
  }

  /* trees */
  for(const tr of trees){tr.wob=Math.max(0,tr.wob-dt);if(!tr.alive){tr.rt-=dt;if(tr.rt<=0&&dist(tr,P)>80){tr.alive=true;tr.hp=tr.max}}}

  /* bears */
  for(let i=0;i<bears.length;i++){
    const b=bears[i];
    if(!b.alive){b.rt-=dt;if(b.rt<=0)bears[i]=newBear(true);continue}
    b.flash=Math.max(0,b.flash-dt);b.atkT-=dt;
    const d=dist(b,P),aggro=d<230&&P.y<FOREST.y1+130;
    let tx=b.tx,ty=b.ty,sp=40;
    if(aggro){tx=P.x;ty=P.y;sp=88}
    else if(Math.hypot(b.tx-b.x,b.ty-b.y)<10){const q=newBear(false);b.tx=q.x;b.ty=q.y}
    const dx=tx-b.x,dy=ty-b.y,l=Math.hypot(dx,dy);
    if(l>(aggro?38:4)){b.x+=dx/l*sp*dt;b.y+=dy/l*sp*dt;b.walk+=dt*8;if(Math.abs(dx)>3)b.face=dx>0?1:-1}
    b.y=clamp(b.y,FOREST.y0,FOREST.y1+90);
    if(aggro&&d<50&&b.atkT<=0){
      b.atkT=1.1;P.hp-=1;P.hurtT=.3;P.lastHit=0;addText(P.x,P.y-60,'-1','#ff6060');
      if(P.hp<=0){
        for(const s of P.stack)dropItem(P.x,P.y,s);P.stack=[];
        P.x=TOWN.x;P.y=TOWN.y+60;P.hp=P.maxHp;toast('クマにやられた…町に戻った');
      }
    }
  }

  /* ground items */
  for(const it of items){
    it.age+=dt;if(it.z>0||it.vz>0){it.vz-=600*dt;it.z=Math.max(0,it.z+it.vz*dt);if(it.z===0)it.vz=0}
    if(it.age>.35&&P.stack.length<cap&&dist(it,P)<60){it.dead=true;P.stack.push(it.type);fly(it.x,it.y,0,0,it.type)}
  }
  items=items.filter(i=>!i.dead);

  /* market drop */
  if(Math.hypot(P.x-DROP.x,P.y-DROP.y)<55){
    MK.dropT=(MK.dropT||0)+dt;
    while(MK.dropT>.08){MK.dropT-=.08;if(MK.meat<MK.cap&&takeTop('meat')){MK.meat++;flyers.push({x0:P.x,y0:P.y-50,x1:MK.x,y1:MK.y-30,type:'meat',k:0,abs:true})}else break}
  }
  /* customers */
  const queue=customers.filter(c=>!c.out);
  queue.forEach((c,i)=>{const s=slotPos(i);walkTo(c,s.x,s.y,85,dt)});
  const front=queue[0];
  if(front&&Math.hypot(front.x-slotPos(0).x,front.y-slotPos(0).y)<4&&MK.meat>0){
    MK.buyT+=dt;
    if(MK.buyT>.55){MK.buyT=0;MK.meat--;front.out=true;front.carry=true;piles[0].n+=price;addText(MK.x-40,MK.y-40,'+'+price,'#ffd34d')}
  }
  for(const c of customers)if(c.out){walkTo(c,-60,c.y+10,95,dt);if(c.x<-50)c.gone=true}
  customers=customers.filter(c=>!c.gone);
  while(customers.filter(c=>!c.out).length<4)customers.push(newCustomer(-40,MK.y+35+R(-4,4)));

  /* rent */
  for(const p of piles)if(p.rent!==undefined){p.rent+=dt;if(p.rent>6){p.rent=0;if(p.n<80)p.n+=5}}

  /* piles pickup */
  for(const p of piles){
    if(p.n<=0||Math.hypot(P.x-p.x,P.y-p.y)>55)continue;
    if(p.type==='coin'){const a=Math.max(1,Math.ceil(p.n/12));p.n-=a;money+=a;if(Math.random()<.6)flyers.push({x0:p.x,y0:p.y-10,x1:P.x,y1:P.y-40,type:'coin',k:0,abs:true})}
    else if(P.stack.length<cap){p.ptT=(p.ptT||0)+dt;if(p.ptT>.07){p.ptT=0;p.n--;P.stack.push('log');fly(p.x,p.y-10,0,0,'log')}}
  }

  /* pads */
  for(const p of PADS){
    if(!visible(p))continue;
    if(Math.abs(P.x-p.x)<58&&Math.abs(P.y-p.y)<44){
      p.payT=(p.payT||0)+dt;
      while(p.payT>.07){
        p.payT-=.07;let moved=false;
        if(p.need.log&&p.paid.log<p.need.log&&takeTop('log')){p.paid.log++;moved=true;flyers.push({x0:P.x,y0:P.y-50,x1:p.x,y1:p.y,type:'log',k:0,abs:true})}
        else if(p.need.coin&&p.paid.coin<p.need.coin&&money>0){const a=Math.min(money,p.need.coin-p.paid.coin,Math.max(1,Math.ceil(p.need.coin/30)));money-=a;p.paid.coin+=a;moved=true;flyers.push({x0:P.x,y0:P.y-40,x1:p.x,y1:p.y,type:'coin',k:0,abs:true})}
        if((p.paid.log||0)>=(p.need.log||0)&&(p.paid.coin||0)>=(p.need.coin||0)){build(p);break}
        if(!moved){p.payT=0;break}
      }
    }else p.payT=0;
  }

  /* npcs */
  for(const n of npcs){
    n.swing=Math.max(0,n.swing-dt*4);n.atkT-=dt;
    if(n.kind==='lumber'){
      if(n.state==='seek'){
        if(!n.tg||!n.tg.alive){let bd=1e9;n.tg=null;for(const tr of trees)if(tr.alive){const d=Math.hypot(tr.x-n.hx,tr.y-n.hy);if(d<bd&&!npcs.some(o=>o!==n&&o.tg===tr)){bd=d;n.tg=tr}}}
        if(n.tg&&walkTo(n,n.tg.x-30,n.tg.y+8,110,dt)<6&&n.atkT<=0){n.atkT=.8;n.swing=1;n.face=1;n.tg.hp--;n.tg.wob=.3;puff(n.tg.x,n.tg.y-30,4,'#fff');if(n.tg.hp<=0){fellTree(n.tg,false);n.carry=2;n.state='ret'}}
      }else if(walkTo(n,n.hx,n.hy-10,110,dt)<6){const pl=piles.find(p=>p.type==='log');if(pl.n<40)pl.n+=n.carry;n.carry=0;n.state='seek';n.tg=null}
    }else{
      if(n.state==='seek'){
        if(!n.tg||!n.tg.alive||!bears.includes(n.tg)){let bd=1e9;n.tg=null;for(const b of bears)if(b.alive){const d=Math.hypot(b.x-n.x,b.y-n.y);if(d<bd){bd=d;n.tg=b}}}
        if(n.tg&&walkTo(n,n.tg.x-n.face*0-35,n.tg.y+6,120,dt)<10&&n.atkT<=0){n.atkT=.6;n.swing=1;n.face=1;n.tg.hp-=2;n.tg.flash=.15;puff(n.tg.x,n.tg.y-20,4,'#fff');if(n.tg.hp<=0){n.tg.alive=false;n.tg.rt=12;puff(n.tg.x,n.tg.y-15,14,'#fff');n.carry=3;n.state='ret'}}
      }else if(walkTo(n,MK.x+60,MK.y+40,120,dt)<8){MK.meat=Math.min(MK.cap,MK.meat+n.carry);n.carry=0;n.state='seek';n.tg=null}
    }
  }

  saveT+=dt;if(saveT>2){saveT=0;save()}
}
function walkTo(o,x,y,sp,dt){const dx=x-o.x,dy=y-o.y,l=Math.hypot(dx,dy);if(l>1){const s=Math.min(l,sp*dt);o.x+=dx/l*s;o.y+=dy/l*s;o.walk=(o.walk||0)+dt*11;if(Math.abs(dx)>2)o.face=dx>0?1:-1}return l}
function fellTree(tr,drop){tr.alive=false;tr.rt=14;puff(tr.x,tr.y-40,16,'#ffffff');if(drop){dropItem(tr.x,tr.y,'log');dropItem(tr.x,tr.y,'log')}}

/* ================= drawing primitives ================= */
function poly(pts,fill){ctx.beginPath();for(let i=0;i<pts.length;i+=2)i?ctx.lineTo(pts[i],pts[i+1]):ctx.moveTo(pts[i],pts[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function shadow(x,y,rx){ell(x,y,rx,rx*.35,'rgba(70,100,140,.22)')}
function txt(s,x,y,px,col,align='center',stroke='rgba(0,30,70,.75)'){ctx.font=`900 ${px}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineWidth=px*.22;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function logIcon(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#8a5a2f';ctx.beginPath();ctx.roundRect(-11,-4,22,8,3);ctx.fill();ell(-10,0,3,4,'#d9a86a');ell(10,0,3,4,'#d9a86a');ctx.restore()}
function meatIcon(x,y,s=1,cooked){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#f3efe6';ctx.fillRect(4,-1.5,9,3);ell(13,-2,2.4,2.4,'#f3efe6');ell(13,2,2.4,2.4,'#f3efe6');ell(-2,0,9,6,cooked?'#a5532a':'#d9474f');ell(-4,-2,4,2.2,cooked?'#c97a45':'#ef7b81');ctx.restore()}
function coinIcon(x,y,r=7){ell(x,y+1.5,r,r*.9,'#c98a10');ell(x,y,r,r*.9,'#ffcd3c');ell(x,y,r*.55,r*.5,'#ffe27a')}
function itemIcon(type,x,y,s=1){if(type==='log')logIcon(x,y,s);else if(type==='meat')meatIcon(x,y,s,built.has('grill'));else coinIcon(x,y,7*s)}

function person(x,y,col,o={}){
  const bob=o.moving?Math.abs(Math.sin(o.walk||0))*3:0,f=o.face||1;
  shadow(x,y,14);
  const lg=o.moving?Math.sin(o.walk||0)*4:0;
  ctx.fillStyle='#3b4a63';ctx.fillRect(x-7+lg*.5,y-10,5,10);ctx.fillRect(x+2-lg*.5,y-10,5,10);
  y-=bob;
  if(o.stack)drawStack(x-f*6,y,o.stack);
  ell(x,y-19,13,14,o.hurt?'#ff6a6a':col);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(x-13,y-12,26,3);
  ell(x,y-36,11,11,'#f6fbff');ell(x+f*1.5,y-35,7.5,7.5,'#ffd9b8');
  ctx.fillStyle='#2a2a2a';ctx.fillRect(x+f*1.5-4,y-37,2,3);ctx.fillRect(x+f*1.5+2,y-37,2,3);
  if(o.tool){
    ctx.save();ctx.translate(x+f*12,y-20);ctx.scale(f,1);ctx.rotate(-1.2+(o.swing||0)*2.2);
    ctx.fillStyle='#7a4f28';ctx.fillRect(-1.5,-22,3,24);
    if(o.tool==='axe'){ctx.fillStyle='#c9d3dd';ctx.beginPath();ctx.moveTo(1,-22);ctx.lineTo(10,-25);ctx.lineTo(10,-13);ctx.lineTo(1,-15);ctx.fill()}
    else{ctx.fillStyle='#c9d3dd';ctx.beginPath();ctx.moveTo(-3,-22);ctx.lineTo(0,-31);ctx.lineTo(3,-22);ctx.fill()}
    ctx.restore();
  }
  if(o.carry)for(let i=0;i<o.carry;i++)itemIcon(o.carryType,x,y-52-i*8,.85);
}
function drawStack(x,y,stack){
  for(let i=0;i<stack.length;i++){const yy=y-26-i*7.5;itemIcon(stack[i],x,yy,.9)}
}
function drawTree(tr){
  const x=tr.x,y=tr.y;
  if(!tr.alive){shadow(x,y,14);ell(x,y-3,11,5,'#6b4527');ell(x,y-5,9,3.5,'#c9935a');ell(x,y-6,6,2,'#fff');return}
  shadow(x,y,26);
  const w=Math.sin(t*40)*tr.wob*8;
  ctx.fillStyle='#5b3b22';ctx.fillRect(x-5,y-18,10,18);
  for(let i=0;i<3;i++){
    const by=y-14-i*24,hw=30-i*7,hh=34,ox=w*(i+1)/3;
    poly([x-hw+ox*.5,by,x+hw+ox*.5,by,x+ox,by-hh],i===0?'#2c6a55':'#337a62');
    poly([x-hw*.55+ox*.7,by-hh*.45,x+hw*.55+ox*.7,by-hh*.45,x+ox,by-hh],'#f4faff');
  }
  if(tr.hp<tr.max)bar(x,y-92,34,tr.hp/tr.max,'#7ad16a');
}
function bar(x,y,w,f,c){ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(x-w/2-2,y-4,w+4,8,4);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x-w/2,y-2.5,w*Math.max(0,f),5,3);ctx.fill()}
function drawBear(b){
  if(!b.alive)return;
  const x=b.x,y=b.y,f=b.face,st=Math.sin(b.walk)*3,c=b.flash>0?'#fff':'#7a5236',c2=b.flash>0?'#fff':'#5e3e28';
  shadow(x,y,30);
  ctx.fillStyle=c2;ctx.fillRect(x-20,y-12+st*.3,8,12);ctx.fillRect(x+12,y-12-st*.3,8,12);
  ell(x,y-22,28,18,c);
  ctx.fillStyle=c;ctx.fillRect(x-16,y-12-st*.3,8,12);ctx.fillRect(x+8,y-12+st*.3,8,12);
  const hx=x+f*24,hy=y-30;
  ell(hx-f*8,hy-12,5,5,c2);ell(hx+f*4,hy-13,5,5,c2);
  ell(hx,hy,14,12,c);ell(hx+f*9,hy+3,7,5,b.flash>0?'#fff':'#c8a27a');ell(hx+f*14,hy+1,2.5,2,'#222');
  ctx.fillStyle='#222';ctx.fillRect(hx+f*3-1.5,hy-5,3,3);
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx+f*0,hy-9);ctx.lineTo(hx+f*7,hy-6);ctx.stroke();
  if(b.hp<b.max)bar(x,y-58,40,b.hp/b.max,'#ff5a5a');
}
function house(x,y,w,h,wall,roof,label){
  shadow(x,y+2,w*.65);
  ctx.fillStyle=wall;ctx.fillRect(x-w/2,y-h,w,h);
  ctx.fillStyle='rgba(0,0,0,.12)';for(let i=1;i<h/9;i++)ctx.fillRect(x-w/2,y-h+i*9,w,1.5);
  poly([x-w/2-10,y-h+2,x+w/2+10,y-h+2,x+w/2-4,y-h-30,x-w/2+4,y-h-30],roof);
  poly([x-w/2-4,y-h-22,x+w/2+4,y-h-22,x+w/2-4,y-h-31,x-w/2+4,y-h-31],'#f6fbff');
  ctx.fillStyle='#4a2f1c';ctx.fillRect(x-8,y-24,16,24);
  ctx.fillStyle=`rgba(255,200,90,${.75+Math.sin(t*3+x)*.15})`;ctx.fillRect(x-w/2+8,y-h+12,14,12);ctx.fillRect(x+w/2-22,y-h+12,14,12);
  if(label)txt(label,x,y-h-44,13,'#fff');
}
function drawBuilding(p){
  const x=p.x,y=p.y+30;
  switch(p.id){
    case 'furnace':{
      shadow(x,y,48);
      ell(x,y-6,44,16,'#7e8a96');ctx.fillStyle='#8e9aa6';ctx.fillRect(x-44,y-34,88,28);ell(x,y-34,44,16,'#a5b0bb');
      for(let i=0;i<6;i++){ctx.fillStyle='#6f7b87';ctx.fillRect(x-40+i*14,y-28+(i%2)*8,10,5)}
      ell(x,y-36,34,11,'#3a2a22');
      const fl=Math.sin(t*12)*3;
      ell(x,y-46-fl,22,18,'rgba(255,120,30,.9)');ell(x,y-50+fl,14,15,'rgba(255,190,60,.95)');ell(x,y-50,7,9,'#fff3b0');
      if(Math.random()<.3)parts.push({x:x+R(-10,10),y:y-70,vx:R(-8,8),vy:R(-60,-30),life:1.2,c:'rgba(180,190,200,.5)',r:R(5,9)});
      break}
    case 'grill':{
      shadow(x,y,34);ctx.fillStyle='#555';ctx.fillRect(x-28,y-22,4,22);ctx.fillRect(x+24,y-22,4,22);
      ell(x,y-24,30,10,'#3a3a3a');ell(x,y-26,26,7,`rgba(255,${120+Math.sin(t*10)*40},40,.9)`);
      for(let i=-1;i<=1;i++)meatIcon(x+i*16,y-31,.75,true);
      txt('肉焼き台',x,y-52,12,'#fff');break}
    case 'house1':case 'house2':case 'house3':house(x,y,78,50,'#b07a4a',['#c54b3c','#3f78c4','#4e9a5a'][+p.id.slice(-1)-1]);break;
    case 'lumber':house(x,y,80,48,'#8a5a2f','#6b3d1d','木こり小屋');break;
    case 'hunter':house(x,y,80,48,'#7d6a4f','#3d6b3a','狩人小屋');break;
    case 'tower':{
      shadow(x,y,40);ctx.fillStyle='#6b4527';
      ctx.fillRect(x-30,y-120,7,120);ctx.fillRect(x+23,y-120,7,120);
      ctx.strokeStyle='#5b3b22';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<3;i++){ctx.moveTo(x-26,y-i*38);ctx.lineTo(x+26,y-38-i*38);ctx.moveTo(x+26,y-i*38);ctx.lineTo(x-26,y-38-i*38)}ctx.stroke();
      ctx.fillStyle='#8a5a2f';ctx.fillRect(x-38,y-132,76,14);
      poly([x-42,y-132,x+42,y-132,x,y-170],'#c54b3c');poly([x-26,y-148,x+26,y-148,x,y-170],'#f6fbff');
      ctx.fillStyle='#333';ctx.fillRect(x-1,y-200,2,32);poly([x+1,y-200,x+24+Math.sin(t*5)*3,y-193,x+1,y-186],'#ffcd3c');
      break}
  }
}
function drawMarket(){
  const x=MK.x,y=MK.y;
  shadow(x,y+4,60);
  ctx.fillStyle='#8a5a2f';ctx.fillRect(x-52,y-70,6,70);ctx.fillRect(x+46,y-70,6,70);
  ctx.fillStyle='#a8743f';ctx.fillRect(x-56,y-28,112,28);ctx.fillStyle='#c48e55';ctx.fillRect(x-58,y-32,116,8);
  for(let i=0;i<7;i++)poly([x-60+i*17.2,y-72,x-60+(i+1)*17.2,y-72,x-60+(i+1)*17.2,y-58,x-60+i*17.2,y-58],i%2?'#fff':'#e04646');
  for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#fff':'#e04646';ctx.beginPath();ctx.arc(x-51.4+i*17.2,y-58,8.6,0,Math.PI);ctx.fill()}
  const n=Math.min(MK.meat,12);for(let i=0;i<n;i++)meatIcon(x-40+(i%6)*15,y-38-Math.floor(i/6)*8,.8,built.has('grill'));
  txt('市場',x,y-88,15,'#fff');
  txt(`肉 ${MK.meat}`,x,y+14,12,'#fff');
  // drop zone
  const near=Math.hypot(P.x-DROP.x,P.y-DROP.y)<55;
  ctx.save();ctx.setLineDash([8,6]);ctx.lineWidth=3;ctx.strokeStyle=near?'#ffd34d':'rgba(255,255,255,.9)';
  ctx.fillStyle=near?'rgba(255,211,77,.25)':'rgba(70,150,230,.2)';ctx.beginPath();ctx.roundRect(DROP.x-48,DROP.y-28,96,56,14);ctx.fill();ctx.stroke();ctx.restore();
  meatIcon(DROP.x-14,DROP.y,1.1,built.has('grill'));txt('売る',DROP.x+18,DROP.y,13,'#fff');
}
function drawPile(p){
  if(p.type==='coin'){
    shadow(p.x,p.y,20);
    const n=Math.min(Math.ceil(p.n/5),14);
    for(let i=0;i<n;i++)coinIcon(p.x+((i%3)-1)*9,p.y-3-Math.floor(i/3)*4-(i%3===1?2:0),8);
    if(p.n>0)txt(String(p.n),p.x,p.y-30-Math.floor(n/3)*4,12,'#ffd34d');
  }else{
    shadow(p.x,p.y,26);ctx.fillStyle='rgba(120,90,60,.35)';ctx.fillRect(p.x-28,p.y-4,56,6);
    const n=Math.min(p.n,15);for(let i=0;i<n;i++)logIcon(p.x+((i%3)-1)*16,p.y-4-Math.floor(i/3)*8,.9);
    txt('丸太 '+p.n,p.x,p.y-56,12,'#fff');
  }
}
function drawPad(p){
  const on=Math.abs(P.x-p.x)<58&&Math.abs(P.y-p.y)<44;
  const tot=(p.need.log||0)+(p.need.coin||0),paid=(p.paid.log||0)+(p.paid.coin||0);
  ctx.save();
  ctx.fillStyle=on?'rgba(255,211,77,.3)':'rgba(40,120,220,.22)';ctx.beginPath();ctx.roundRect(p.x-58,p.y-40,116,80,16);ctx.fill();
  ctx.fillStyle='rgba(255,211,77,.55)';ctx.beginPath();ctx.roundRect(p.x-58,p.y-40,116*paid/tot,80,16);ctx.fill();
  ctx.setLineDash([10,7]);ctx.lineDashOffset=-t*20;ctx.lineWidth=3.5;ctx.strokeStyle=on?'#ffd34d':'#fff';ctx.beginPath();ctx.roundRect(p.x-58,p.y-40,116,80,16);ctx.stroke();
  ctx.restore();
  txt(p.name,p.x,p.y-16,14,'#fff');
  if(p.need.log){const r=p.need.log-p.paid.log;logIcon(p.x-20,p.y+12,1.1);txt(String(r),p.x+12,p.y+12,18,'#fff')}
  else{const r=p.need.coin-p.paid.coin;coinIcon(p.x-20,p.y+12,9);txt(String(r),p.x+12,p.y+12,18,'#ffd34d')}
}
function nextGoal(){
  let best=null;
  for(const p of PADS)if(visible(p)){const c=(p.need.log||0)+(p.need.coin||0)*.5;if(!best||c<best.c)best={p,c}}
  return best&&best.p;
}

/* ================= render ================= */
let cam={x:0,y:0};
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const vw=W/Z,vh=H/Z;
  cam.x=clamp(P.x-vw/2,Math.min(0,WW-vw),Math.max(0,WW-vw));cam.y=clamp(P.y-vh*.55,Math.min(0,WH-vh),Math.max(0,WH-vh));
  if(vw>WW)cam.x=(WW-vw)/2;if(vh>WH)cam.y=(WH-vh)/2;
  ctx.fillStyle='#cfe0ee';ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*Z,0,0,DPR*Z,-cam.x*DPR*Z,-cam.y*DPR*Z);
  // ground
  ctx.fillStyle='#eef5fb';ctx.fillRect(0,0,WW,WH);
  for(const b of bumps)ell(b.x,b.y,b.r,b.r*.45,'rgba(205,224,240,.55)');
  ell(TOWN.x-60,TOWN.y-40,470,260,'rgba(222,212,196,.55)');
  ctx.fillStyle='rgba(215,202,184,.6)';ctx.beginPath();ctx.moveTo(TOWN.x-40,TOWN.y-200);ctx.lineTo(TOWN.x+40,TOWN.y-200);ctx.lineTo(TOWN.x+60,FOREST.y1-20);ctx.lineTo(TOWN.x-60,FOREST.y1-20);ctx.fill();
  if(built.has('furnace')){const g=ctx.createRadialGradient(760,1000,10,760,1000,300);g.addColorStop(0,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=g;ctx.fillRect(460,700,600,600)}
  // pads + drop zones (ground layer)
  for(const p of PADS)if(visible(p))drawPad(p);
  // items on ground
  for(const it of items){shadow(it.x,it.y,10);itemIcon(it.type,it.x,it.y-6-it.z+Math.sin(t*4+it.x)*1.5,1)}
  // sortable
  const L=[];
  for(const tr of trees)L.push([tr.y,()=>drawTree(tr)]);
  for(const b of bears)if(b.alive)L.push([b.y,()=>drawBear(b)]);
  for(const p of PADS)if(built.has(p.id))L.push([p.y+30,()=>drawBuilding(p)]);
  L.push([MK.y,drawMarket]);
  for(const p of piles)L.push([p.y,()=>drawPile(p)]);
  for(const c of customers)L.push([c.y,()=>{person(c.x,c.y,c.col,{moving:true,walk:c.walk,face:c.out?-1:1,carry:c.carry?1:0,carryType:'meat'})}]);
  for(const n of npcs)L.push([n.y,()=>person(n.x,n.y,n.kind==='lumber'?'#7c5a3a':'#3d7a46',{moving:true,walk:n.walk,face:n.face,tool:n.kind==='lumber'?'axe':'spear',swing:n.swing,carry:n.carry,carryType:n.kind==='lumber'?'log':'meat'})]);
  L.push([P.y,()=>{person(P.x,P.y,'#f08a24',{moving:P.moving,walk:P.walk,face:P.face,tool:'axe',swing:P.swing,stack:P.stack,hurt:P.hurtT>0});if(P.hp<P.maxHp)bar(P.x,P.y-70-P.stack.length*7.5,40,P.hp/P.maxHp,'#5fd36a')}]);
  L.sort((a,b)=>a[0]-b[0]);for(const d of L)d[1]();
  // particles
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);ell(p.x,p.y,p.r,p.r,p.c)}ctx.globalAlpha=1;
  // flyers
  for(const f of flyers){const k=f.k,x1=f.abs?f.x1:P.x,y1=f.abs?f.y1:P.y-40,x=f.x0+(x1-f.x0)*k,y=f.y0+(y1-f.y0)*k-Math.sin(k*Math.PI)*50;itemIcon(f.type,x,y,1)}
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*1.5);txt(x.s,x.x,x.y,20,x.c)}ctx.globalAlpha=1;
  // goal arrow (world)
  const g=nextGoal();
  if(started&&g){
    const sx=(g.x-cam.x)*Z,sy=(g.y-cam.y)*Z;
    if(sx>30&&sx<W-30&&sy>90&&sy<H-30){const by=g.y-62+Math.sin(t*6)*6;poly([g.x-12,by-16,g.x+12,by-16,g.x,by],'#ffd34d')}
    else{
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const cx=W/2,cy=H/2,a=Math.atan2(sy-cy,sx-cx),r=Math.min(W,H)/2-40;
      const ax=clamp(cx+Math.cos(a)*r*1.5,34,W-34),ay=clamp(cy+Math.sin(a)*r*1.5,100,H-34);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);poly([18,0,-10,-13,-10,13],'#ffd34d');ctx.restore();
    }
  }
  // HUD
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(let i=0;i<60;i++){const sx=(i*97.3+t*(20+i%5*6))%W,sy=(i*53.7+t*(40+i%7*8))%H;ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(sx,sy,1+i%3*.7,0,7);ctx.fill()}
  ctx.fillStyle='rgba(10,35,65,.6)';ctx.beginPath();ctx.roundRect(12,12,128,38,19);ctx.fill();
  coinIcon(33,31,11);txt(String(money),52,31,20,'#ffd34d','left',null);
  ctx.fillStyle='rgba(10,35,65,.6)';ctx.beginPath();ctx.roundRect(12,56,128,30,15);ctx.fill();
  const full=P.stack.length>=cap;txt(`カゴ ${P.stack.length}/${cap}`,26,71,15,full?'#ff8a8a':'#fff','left',null);
  if(g&&started){
    const s=`次：${g.name}を建てよう`;ctx.font=`900 15px ${FONT}`;const w=Math.min(W-170,ctx.measureText(s).width+30);
    ctx.fillStyle='rgba(10,35,65,.6)';ctx.beginPath();ctx.roundRect(W-w-12,12,w,34,17);ctx.fill();txt(s,W-w/2-12,29,15,'#fff','center',null);
  }
  if(full&&started){ctx.globalAlpha=.6+Math.sin(t*8)*.4;txt('カゴがいっぱい！',W/2,H-110,20,'#ff8a8a');ctx.globalAlpha=1}
  if(toastT>0){ctx.globalAlpha=Math.min(1,toastT);ctx.font=`800 15px ${FONT}`;const w=ctx.measureText(toastMsg).width+36;ctx.fillStyle='rgba(10,35,65,.8)';ctx.beginPath();ctx.roundRect(W/2-w/2,96,w,36,18);ctx.fill();txt(toastMsg,W/2,114,15,'#fff','center',null);ctx.globalAlpha=1}
  if(joy.on){const dx=joy.cx-joy.bx,dy=joy.cy-joy.by,l=Math.hypot(dx,dy),k=l>45?45/l:1;ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(joy.bx,joy.by,48,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(joy.bx+dx*k,joy.by+dy*k,22,0,7);ctx.fill()}
}

/* ================= boot ================= */
reset();
if(hasSave()){ovB.textContent='つづきから';ovR.style.display=''}
ovB.onclick=()=>{if(!started&&hasSave())load();started=true;ov.classList.add('hide')};
ovR.onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}reset();started=true;ov.classList.add('hide')};
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__g={get P(){return P},get money(){return money},set money(v){money=v},built:()=>[...built],trees,get bears(){return bears},MK,PADS,start(){ovB.click()},get npcs(){return npcs}};
})();
</script>

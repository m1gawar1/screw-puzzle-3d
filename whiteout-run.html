<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雪原サバイバル・ラン</title>
<style>
  html,body{margin:0;height:100%;background:#0e1c2b;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;height:100%;display:flex;justify-content:center}
  canvas{display:block;touch-action:none}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(10,30,52,.55);padding:24px;box-sizing:border-box}
  #ov.hide{display:none}
  #ov h1{font-size:34px;margin:0 0 10px;text-shadow:0 3px 0 #1b4f8a;line-height:1.2}
  #ov p{margin:0 0 22px;font-size:16px;line-height:1.6;max-width:320px}
  #ov button{font:inherit;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(#4db3ff,#1a74d6);border:0;border-bottom:5px solid #124f96;border-radius:16px;padding:14px 38px;cursor:pointer}
  #ov button:active{transform:translateY(3px);border-bottom-width:2px}
  #credit{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#ffffff99;font-size:10px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ov">
    <h1 id="ovT">雪原サバイバル・ラン</h1>
    <p id="ovP">指でドラッグして左右に動こう。<br>ゲートで仲間を増やして、最後の氷の怪物を倒せ！</p>
    <button id="ovB">スタート</button>
  </div>
  <div id="credit">オリジナルのファンメイド作品です（特定のゲームとは無関係）</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const FONT='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
let W,H,DPR,HOR,F;
const CAMH=6.5,PREL=7,ROAD=3.2,SPEED=9;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.min(window.innerWidth,520);H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HOR=H*0.26;F=W*1.0;
}
window.addEventListener('resize',resize);resize();

/* ---------- state ---------- */
let state='ready',pz,gx,tx,count,camX,ents,parts,texts,boss,bossT,t=0,flash=0,snow=[];
const BOSS_Z=250;

function reset(){
  state='ready';pz=0;gx=0;tx=0;camX=0;count=5;parts=[];texts=[];bossT=0;flash=0;
  boss={z:BOSS_Z,hp:150,max:150,shake:0,dead:false,fade:1};
  const G=(z,a,b)=>({k:'gate',z,used:false,pick:-1,o:[a,b]});
  const E=(z,x,n,hw)=>({k:'enemy',z,x,n,hw,dead:false});
  const S=(z,x)=>({k:'surv',z,x,got:false});
  const A=v=>({t:'add',v}),M=v=>({t:'mul',v}),D=v=>({t:'sub',v});
  ents=[G(25,A(8),M(2))];
  for(let i=0;i<6;i++)ents.push(S(40+i*2,1.6));
  ents.push(E(58,-1.2,10,1.4));
  ents.push(G(78,D(6),A(10)));
  ents.push(G(98,M(2),A(20)));
  ents.push(E(120,0,30,1.5));
  ents.push(G(145,A(15),M(3)));
  ents.push(G(170,D(10),M(2)));
  ents.push(E(195,-1.8,40,1.3));
  for(let i=0;i<5;i++)ents.push(S(205+i*2,0.8));
  ents.push(G(222,M(2),A(30)));
  snow=[];for(let i=0;i<90;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.2,v:30+Math.random()*50,p:Math.random()*6});
}

/* ---------- projection ---------- */
const camZ=()=>pz-PREL;
function proj(x,y,z){const rel=z-camZ();const s=F/rel;return{x:W/2+(x-camX)*s,y:HOR+(CAMH-y)*s,s,rel}}
const fog=rel=>Math.max(0,Math.min(1,(115-rel)/45));
function rnd(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)}
function crowdR(n){return 0.17*Math.sqrt(Math.min(n,90))+0.15}

/* ---------- input ---------- */
let dragging=false,dragX0=0,tx0=0;
cv.addEventListener('pointerdown',e=>{dragging=true;dragX0=e.clientX;tx0=tx;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const s=F/PREL;tx=tx0+(e.clientX-dragX0)/s*1.25});
const up=()=>dragging=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const keys={};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
ovB.addEventListener('click',()=>{if(state!=='ready')reset();state='run';ov.classList.add('hide')});

/* ---------- helpers ---------- */
function addText(x,y,z,txt,col){const p=proj(x,y,z);texts.push({x:p.x,y:p.y,txt,col,life:1})}
function burst(x,y,z,n,col){for(let i=0;i<n;i++)parts.push({x,y,z,vx:(Math.random()-.5)*5,vy:Math.random()*5+1,vz:(Math.random()-.5)*5,life:.7+Math.random()*.4,c:col,r:.08+Math.random()*.08,g:true})}
function setCount(n){count=Math.max(0,Math.min(9999,Math.round(n)));}
function end(win){
  state=win?'win':'lose';
  setTimeout(()=>{
    ovT.textContent=win?'クリア！':'全滅…';
    ovP.innerHTML=win?`氷の怪物を倒した！<br>生き残った隊員：<b>${count}</b>人`:'ゲートの選び方を変えて、もう一度挑戦しよう！';
    ovB.textContent='もう一度あそぶ';ov.classList.remove('hide');
  },win?900:700);
}

/* ---------- update ---------- */
function update(dt){
  t+=dt;
  for(const s of snow){s.y+=s.v*dt;s.x+=Math.sin(t+s.p)*14*dt-8*dt;if(s.y>H){s.y=-4;s.x=Math.random()*W}if(s.x<0)s.x=W}
  if(keys.ArrowLeft||keys.a)tx-=4*dt;if(keys.ArrowRight||keys.d)tx+=4*dt;
  const lim=ROAD-0.5;tx=Math.max(-lim,Math.min(lim,tx));
  gx+=(tx-gx)*Math.min(1,dt*12);camX+=(gx*0.55-camX)*Math.min(1,dt*6);
  flash=Math.max(0,flash-dt*3);boss.shake=Math.max(0,boss.shake-dt);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.g){p.vy-=12*dt;if(p.y<0){p.y=0;p.vy*=-.3}}}
  parts=parts.filter(p=>p.life>0);
  for(const x of texts){x.life-=dt*1.1;x.y-=40*dt}
  texts=texts.filter(x=>x.life>0);
  if(boss.dead)boss.fade=Math.max(0,boss.fade-dt*1.2);

  if(state==='run'){
    const prev=pz;pz+=SPEED*dt;
    const gr=crowdR(count);
    for(const e of ents){
      if(e.k==='gate'&&!e.used&&prev<e.z&&pz>=e.z){
        e.used=true;e.pick=gx<0?0:1;const o=e.o[e.pick];
        const before=count;
        setCount(o.t==='add'?count+o.v:o.t==='mul'?count*o.v:count-o.v);
        const d=count-before;
        addText(gx,2,pz,(d>=0?'+':'')+d,d>=0?'#7dffb0':'#ff8080');
        burst(gx,1,pz+1,14,d>=0?'#7fd0ff':'#ff7a7a');
        flash=.5;
        if(count<=0)return end(false);
      }else if(e.k==='surv'&&!e.got&&Math.abs(e.z-pz)<0.8&&Math.abs(e.x-gx)<0.6+gr*.7){
        e.got=true;setCount(count+1);addText(e.x,1.3,e.z,'+1','#ffe27a');burst(e.x,.6,e.z,5,'#ffe27a');
      }else if(e.k==='enemy'&&!e.dead&&prev<e.z-0.5&&pz>=e.z-0.5){
        if(Math.abs(gx-e.x)<e.hw+gr*.6){
          e.dead=true;burst(e.x,1,e.z,26,'#ff6a6a');
          if(count<=e.n){setCount(0);addText(gx,2,pz,'-'+e.n,'#ff8080');return end(false)}
          setCount(count-e.n);addText(gx,2,pz,'-'+e.n,'#ff8080');flash=.4;
        }
      }
    }
    if(pz>=BOSS_Z-6){pz=BOSS_Z-6;state='boss';bossT=0}
  }else if(state==='boss'){
    bossT+=dt;
    while(bossT>0.07&&state==='boss'){
      bossT-=0.07;
      const k=Math.max(1,Math.ceil(Math.min(count,boss.hp)*0.07));
      count-=k;boss.hp-=k;boss.shake=.15;
      for(let i=0;i<Math.min(k,5);i++)parts.push({x:gx+(Math.random()-.5)*1.5,y:1,z:pz+1,vx:(boss.z-pz>0?0:0)+(Math.random()-.5)*1,vy:1.5+Math.random(),vz:18,life:.5,c:'#ffffff',r:.13,g:false});
      if(boss.hp<=0){boss.hp=0;boss.dead=true;burst(0,2.5,boss.z,70,'#bfe8ff');count=Math.max(count,1);end(true)}
      else if(count<=0){count=0;end(false)}
    }
  }
}

/* ---------- drawing ---------- */
function poly(pts,fill){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}

function drawBG(){
  let g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,'#8fb9dc');g.addColorStop(1,'#e6f2fa');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+2);
  const off=-camX*6;
  for(let layer=0;layer<2;layer++){
    ctx.fillStyle=layer?'#c4dcee':'#a9c8e0';
    ctx.beginPath();ctx.moveTo(-50,HOR+1);
    for(let i=0;i<9;i++){const x=i*W/6+off*(layer?1.6:1)-30,h=(40+rnd(i+layer*13)*70)*(layer?.7:1);ctx.lineTo(x,HOR-h);ctx.lineTo(x+W/12,HOR+1)}
    ctx.lineTo(W+80,HOR+1);ctx.closePath();ctx.fill();
  }
  g=ctx.createLinearGradient(0,HOR,0,H);g.addColorStop(0,'#f4f9fd');g.addColorStop(1,'#d3e4f1');
  ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H-HOR);
}
function drawRoad(){
  const cz=camZ(),band=4,start=Math.floor((cz+1)/band)*band;
  for(let z=start+100;z>=start-band;z-=band){
    const z0=Math.max(z,cz+0.6),z1=Math.max(z+band,cz+0.6);if(z1<=z0)continue;
    const idx=Math.round(z/band),a=proj(-ROAD,0,z0),b=proj(ROAD,0,z0),c=proj(ROAD,0,z1),d=proj(-ROAD,0,z1);
    poly([a,b,c,d],idx%2?'#c7dbea':'#bcd3e5');
    const e=ROAD+.35,a2=proj(-e,0,z0),a3=proj(-ROAD,0,z0),d3=proj(-ROAD,0,z1),d2=proj(-e,0,z1);
    poly([a2,a3,d3,d2],idx%2?'#7fb2de':'#92c0e6');
    const b2=proj(e,0,z0),c2=proj(e,0,z1);poly([b,b2,c2,c],idx%2?'#7fb2de':'#92c0e6');
  }
  const hz=ctx.createLinearGradient(0,HOR,0,HOR+H*.18);hz.addColorStop(0,'rgba(232,243,251,1)');hz.addColorStop(1,'rgba(232,243,251,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,HOR,W,H*.18);
}
function drawTree(x,z){
  const p=proj(x,0,z);if(p.rel<1.5)return;
  ctx.globalAlpha=fog(p.rel);const s=p.s;
  ctx.fillStyle='#5b4332';ctx.fillRect(p.x-.12*s,p.y-.5*s,.24*s,.5*s);
  for(let i=0;i<3;i++){
    const by=p.y-(.4+i*.85)*s,w=(1.25-i*.28)*s,h=1.2*s;
    poly([{x:p.x-w,y:by},{x:p.x+w,y:by},{x:p.x,y:by-h}],'#2f6b57');
    poly([{x:p.x-w*.62,y:by-h*.38},{x:p.x+w*.62,y:by-h*.38},{x:p.x,y:by-h}],'#f5fbff');
  }
  ctx.globalAlpha=1;
}
function drawUnit(sx,sy,s,body,bob,angry){
  sy-=Math.abs(bob)*.12*s;
  ctx.fillStyle='rgba(60,90,120,.25)';ctx.beginPath();ctx.ellipse(sx,sy,.26*s,.09*s,0,0,7);ctx.fill();
  ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(sx,sy-.3*s,.23*s,.3*s,0,0,7);ctx.fill();
  ctx.fillStyle='#f4f9ff';ctx.beginPath();ctx.arc(sx,sy-.66*s,.2*s,0,7);ctx.fill();
  ctx.fillStyle='#ffd9b8';ctx.beginPath();ctx.arc(sx,sy-.65*s,.13*s,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(sx-.06*s,sy-.68*s,.03*s,.04*s);ctx.fillRect(sx+.03*s,sy-.68*s,.03*s,.04*s);
  if(angry){ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1,.03*s);ctx.beginPath();ctx.moveTo(sx-.08*s,sy-.74*s);ctx.lineTo(sx-.01*s,sy-.7*s);ctx.moveTo(sx+.08*s,sy-.74*s);ctx.lineTo(sx+.01*s,sy-.7*s);ctx.stroke()}
}
function pill(sx,sy,txt,col,px){
  ctx.font=`800 ${px}px ${FONT}`;const w=ctx.measureText(txt).width+px*.9,h=px*1.35;
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(sx-w/2,sy-h/2,w,h,h/2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,sx,sy+px*.04);
}
function crowd(cx,cz,n,body,angry,label,labCol,runBob){
  const N=Math.min(n,90),c=.17,list=[];
  for(let i=0;i<N;i++){
    const a=i*2.39996,r=c*Math.sqrt(i+.5);
    list.push({x:cx+r*Math.cos(a),z:cz+r*Math.sin(a)*.8,i});
  }
  list.sort((a,b)=>b.z-a.z);
  let top=1e9,mid=0;
  for(const u of list){
    const p=proj(u.x,0,u.z);if(p.rel<.8)continue;
    drawUnit(p.x,p.y,p.s,body,runBob?Math.sin(t*14+u.i):0,angry);
    if(p.y-.9*p.s<top)top=p.y-.9*p.s;mid=p.x;
  }
  if(label&&top<1e9){const p=proj(cx,0,cz);pill(p.x,top-12,String(n),labCol,Math.max(16,Math.min(34,p.s*.4)))}
}
function drawGate(g){
  const rel=g.z-camZ();if(rel<1)return;ctx.globalAlpha=fog(rel);
  for(let k=0;k<2;k++){
    const o=g.o[k],good=o.t!=='sub',x0=k?.12:-ROAD,x1=k?ROAD:-.12;
    const a=proj(x0,0,g.z),b=proj(x1,0,g.z),c=proj(x1,2.6,g.z),d=proj(x0,2.6,g.z);
    const chosen=g.used&&g.pick===k;
    poly([a,b,c,d],good?(chosen?'rgba(120,230,255,.9)':'rgba(40,150,255,.55)'):(chosen?'rgba(255,140,140,.9)':'rgba(255,60,70,.55)'));
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,a.s*.07);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.lineTo(c.x,c.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    const lab=(o.t==='add'?'+':o.t==='mul'?'×':'-')+o.v,px=Math.min(a.s*.85,90);
    ctx.font=`900 ${px}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=px*.12;ctx.strokeStyle='rgba(0,40,90,.6)';ctx.strokeText(lab,(a.x+b.x)/2,(a.y+d.y)/2);
    ctx.fillStyle='#fff';ctx.fillText(lab,(a.x+b.x)/2,(a.y+d.y)/2);
  }
  ctx.globalAlpha=1;
}
function drawBoss(){
  const rel=boss.z-camZ();if(rel<1||boss.fade<=0)return;
  const sh=boss.shake>0?(Math.random()-.5)*.25:0,p=proj(sh,0,boss.z),s=p.s;
  ctx.globalAlpha=fog(rel)*boss.fade;
  const cx=p.x,by=p.y;
  ctx.fillStyle='rgba(60,90,120,.3)';ctx.beginPath();ctx.ellipse(cx,by,2.6*s,.5*s,0,0,7);ctx.fill();
  ctx.fillStyle='#8fd0ff';ctx.beginPath();ctx.ellipse(cx,by-2.1*s,2.3*s,2.2*s,0,0,7);ctx.fill();
  ctx.fillStyle='#d8f1ff';ctx.beginPath();ctx.ellipse(cx,by-2.4*s,1.7*s,1.5*s,0,0,7);ctx.fill();
  for(const sd of[-1,1]){
    poly([{x:cx+sd*1.0*s,y:by-3.9*s},{x:cx+sd*1.6*s,y:by-3.9*s},{x:cx+sd*1.9*s,y:by-5.4*s}],'#e9f8ff');
    ctx.fillStyle='#8fd0ff';ctx.beginPath();ctx.ellipse(cx+sd*2.5*s,by-1.8*s,.6*s,1.3*s,sd*.3,0,7);ctx.fill();
    ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.ellipse(cx+sd*.7*s,by-2.8*s,.33*s,.4*s,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+sd*.7*s,by-2.85*s,.1*s,0,7);ctx.fill();
  }
  ctx.fillStyle='#3a5a80';ctx.beginPath();ctx.ellipse(cx,by-1.6*s,1.0*s,.55*s,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';for(let i=-3;i<=3;i++)poly([{x:cx+i*.27*s-.12*s,y:by-2.05*s},{x:cx+i*.27*s+.12*s,y:by-2.05*s},{x:cx+i*.27*s,y:by-1.65*s}],'#fff');
  ctx.globalAlpha=1;
  if(!boss.dead){
    const w=Math.min(W*.6,3.6*s),y=by-5.9*s-8;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(cx-w/2-3,y-9,w+6,22,11);ctx.fill();
    ctx.fillStyle='#ff4d5a';ctx.beginPath();ctx.roundRect(cx-w/2,y-6,Math.max(0,w*boss.hp/boss.max),16,8);ctx.fill();
    ctx.font=`800 13px ${FONT}`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('氷の怪物  '+boss.hp,cx,y+2);
  }
}
function drawSurv(e){
  const p=proj(e.x,0,e.z);if(p.rel<1)return;
  ctx.globalAlpha=fog(p.rel);drawUnit(p.x,p.y,p.s,'#ffb33b',Math.sin(t*5+e.z)*.5,false);
  ctx.globalAlpha=1;
}
function drawParts(){
  for(const q of parts){const p=proj(q.x,q.y,q.z);if(p.rel<.5)continue;ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,q.r*p.s),0,7);ctx.fill()}
  ctx.globalAlpha=1;
}

function render(){
  drawBG();drawRoad();
  const cz=camZ();
  for(let i=Math.floor(cz/5)+24;i>=Math.floor(cz/5);i--)for(const sd of[-1,1]){
    drawTree(sd*(4.7+rnd(i*2+(sd>0?1:0))*5),i*5+rnd(i*3+sd)*3);
  }
  // depth-sorted entities
  const items=[];
  for(const e of ents){if(e.k==='enemy'&&e.dead)continue;if(e.k==='surv'&&e.got)continue;items.push({z:e.k==='enemy'?e.z+1.5:e.z,e})}
  items.push({z:boss.z,e:{k:'boss'}});
  items.push({z:pz,e:{k:'me'}});
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){
    const e=it.e;
    if(e.k==='gate')drawGate(e);
    else if(e.k==='surv')drawSurv(e);
    else if(e.k==='enemy'){const p=proj(e.x,0,e.z);if(p.rel>1){ctx.globalAlpha=fog(p.rel);crowd(e.x,e.z,e.n,'#c9363f',true,true,'#d8252f',false);ctx.globalAlpha=1}}
    else if(e.k==='boss')drawBoss();
    else if(e.k==='me'&&count>0)crowd(gx,pz,count,'#2f86e6',false,true,'#1a74d6',state==='run');
  }
  drawParts();
  // snow
  ctx.fillStyle='rgba(255,255,255,.85)';for(const s of snow){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  // floating texts
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*1.5);ctx.font=`900 34px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,30,70,.7)';ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y)}
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(0,0,W,H)}
  // HUD
  ctx.fillStyle='rgba(0,30,70,.55)';ctx.beginPath();ctx.roundRect(W/2-120,16,240,12,6);ctx.fill();
  ctx.fillStyle='#6fd0ff';ctx.beginPath();ctx.roundRect(W/2-120,16,Math.max(12,240*Math.min(1,pz/(BOSS_Z-6))),12,6);ctx.fill();
  ctx.font=`800 20px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,30,70,.7)';
  ctx.strokeText('隊員 '+count,16,52);ctx.fillStyle='#fff';ctx.fillText('隊員 '+count,16,52);
  if(state==='run'&&boss.z-pz<60&&boss.z-pz>8&&Math.floor(t*4)%2===0){
    ctx.font=`900 30px ${FONT}`;ctx.textAlign='center';ctx.strokeText('BOSS!',W/2,100);ctx.fillStyle='#ff6a6a';ctx.fillText('BOSS!',W/2,100);
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
window.__game={get state(){return state},get count(){return count},start(){ovB.click()},setX(v){tx=v}};
})();
</script>
